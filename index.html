<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intus — Gıda Röntgeni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #f2f3f5;
    --muted: #9aa0aa;
    --accent: #4ade80;
    --danger: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 22px;
    margin: 8px 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    text-align: center;
    max-width: 360px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    margin-bottom: 16px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
  }
  .btn-primary { background: var(--accent); color: #06210f; }
  .btn-secondary { background: #2a2e37; color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  input[type="file"] { display: none; }
  #preview {
    width: 100%;
    border-radius: 12px;
    margin-top: 12px;
    display: none;
  }
  .status {
    text-align: center;
    color: var(--muted);
    margin-top: 12px;
    font-size: 14px;
  }
  .result h2 { font-size: 18px; margin-top: 0; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .badge-dusuk { background: rgba(74,222,128,0.15); color: var(--accent); }
  .badge-orta { background: rgba(251,191,36,0.15); color: var(--warn); }
  .badge-yuksek { background: rgba(248,113,113,0.15); color: var(--danger); }
  .risk-score {
    font-size: 40px;
    font-weight: 800;
    margin: 4px 0;
  }
  ul.ingredients { padding-left: 18px; margin: 8px 0; }
  ul.ingredients li { margin-bottom: 4px; }
  .additive-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #2a2e37;
  }
  .additive-row:last-child { border-bottom: none; }
  #qr-reader {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
  }
  .error-box {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--danger);
    padding: 14px;
    border-radius: 12px;
    font-size: 14px;
    margin-top: 12px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>

<h1>🩻 Intus</h1>
<p class="subtitle">Ambalajın içindekiler yazısının fotoğrafını çek, analiz edelim.</p>

<!-- FOTOĞRAF MODU -->
<div class="card" id="photo-card">
  <label class="btn btn-primary" for="photo-input">📷 İçindekiler Fotoğrafı Çek</label>
  <input type="file" id="photo-input" accept="image/*" capture="environment">
  <img id="preview" alt="Seçilen fotoğraf önizleme">
  <div class="status hidden" id="photo-status">Analiz ediliyor…</div>
  <div class="error-box hidden" id="photo-error"></div>
  <button class="btn btn-secondary hidden" id="try-barcode-btn">Barkodu Okutmayı Dene</button>
</div>

<!-- BARKOD MODU -->
<div class="card hidden" id="barcode-card">
  <h2 style="margin-top:0;font-size:16px;">Barkodu Okut</h2>
  <div id="qr-reader"></div>
  <div class="status hidden" id="barcode-status">Ürün aranıyor…</div>
  <div class="error-box hidden" id="barcode-error"></div>
  <button class="btn btn-secondary" id="back-to-photo-btn">← Fotoğrafla Dene</button>
</div>

<!-- SONUÇ -->
<div class="card result hidden" id="result-card"></div>

<script>
// ==== AYARLAR ====
const WORKER_URL = "https://cool-frog-4829.imsalper.workers.dev"; // Gemini proxy endpoint'i
const RATE_LIMIT_MAX = 50;
const RATE_LIMIT_WINDOW_MS = 30 * 60 * 1000; // 30 dakika

// ==== DOM referansları ====
const photoInput = document.getElementById("photo-input");
const preview = document.getElementById("preview");
const photoStatus = document.getElementById("photo-status");
const photoError = document.getElementById("photo-error");
const tryBarcodeBtn = document.getElementById("try-barcode-btn");
const photoCard = document.getElementById("photo-card");
const barcodeCard = document.getElementById("barcode-card");
const barcodeStatus = document.getElementById("barcode-status");
const barcodeError = document.getElementById("barcode-error");
const backToPhotoBtn = document.getElementById("back-to-photo-btn");
const resultCard = document.getElementById("result-card");

let html5QrCode = null;

// ==== Rate limit (client-side) ====
function checkRateLimit() {
  const now = Date.now();
  let timestamps = JSON.parse(localStorage.getItem("intus_scan_log") || "[]");
  timestamps = timestamps.filter(t => now - t < RATE_LIMIT_WINDOW_MS);
  if (timestamps.length >= RATE_LIMIT_MAX) {
    return false;
  }
  timestamps.push(now);
  localStorage.setItem("intus_scan_log", JSON.stringify(timestamps));
  return true;
}

// ==== Fotoğraf akışı ====
photoInput.addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  resetUI();

  if (!checkRateLimit()) {
    showPhotoError("Çok fazla tarama yaptın. Lütfen biraz sonra tekrar dene.");
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  photoStatus.classList.remove("hidden");
  photoStatus.textContent = "Analiz ediliyor…";

  try {
    const base64 = await fileToBase64(file);
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "photo_analysis",
        image_base64: base64,
        mime_type: file.type || "image/jpeg"
      })
    });

    if (!response.ok) {
      throw new Error("Sunucu hatası: " + response.status);
    }

    const data = await response.json();
    photoStatus.classList.add("hidden");

    if (data.basarili === false) {
      showPhotoError(data.kullanici_mesaji || "İçindekiler listesi net okunamadı.");
      tryBarcodeBtn.classList.remove("hidden");
    } else if (data.basarili === true) {
      renderResult(data);
    } else {
      showPhotoError("Beklenmeyen bir yanıt alındı, lütfen tekrar dene.");
      tryBarcodeBtn.classList.remove("hidden");
    }
  } catch (err) {
    photoStatus.classList.add("hidden");
    showPhotoError("Bağlantı hatası: analiz yapılamadı. Lütfen tekrar dene.");
    tryBarcodeBtn.classList.remove("hidden");
    console.error(err);
  }
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showPhotoError(msg) {
  photoError.textContent = msg;
  photoError.classList.remove("hidden");
}

function resetUI() {
  photoError.classList.add("hidden");
  tryBarcodeBtn.classList.add("hidden");
  resultCard.classList.add("hidden");
  resultCard.innerHTML = "";
}

// ==== Barkod moduna geçiş ====
tryBarcodeBtn.addEventListener("click", () => {
  photoCard.classList.add("hidden");
  barcodeCard.classList.remove("hidden");
  startBarcodeScanner();
});

backToPhotoBtn.addEventListener("click", () => {
  stopBarcodeScanner();
  barcodeCard.classList.add("hidden");
  photoCard.classList.remove("hidden");
  resetUI();
});

function startBarcodeScanner() {
  html5QrCode = new Html5Qrcode("qr-reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    onBarcodeDetected,
    () => {} // sürekli tarama hatalarını sessizce yut
  ).catch(err => {
    barcodeError.textContent = "Kamera açılamadı: " + err;
    barcodeError.classList.remove("hidden");
  });
}

function stopBarcodeScanner() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
    html5QrCode = null;
  }
}

async function onBarcodeDetected(decodedText) {
  stopBarcodeScanner();
  barcodeStatus.classList.remove("hidden");
  barcodeStatus.textContent = "Ürün aranıyor…";
  barcodeError.classList.add("hidden");

  if (!checkRateLimit()) {
    barcodeStatus.classList.add("hidden");
    barcodeError.textContent = "Çok fazla tarama yaptın. Lütfen biraz sonra tekrar dene.";
    barcodeError.classList.remove("hidden");
    return;
  }

  try {
    const offRes = await fetch(`https://world.openfoodfacts.org/api/v2/product/${decodedText}.json`);
    const offData = await offRes.json();

    if (offData.status !== 1 || !offData.product) {
      barcodeStatus.classList.add("hidden");
      barcodeError.textContent = "Bu barkoda ait ürün bulunamadı. Fotoğraf yöntemini tekrar dene.";
      barcodeError.classList.remove("hidden");
      return;
    }

    const ingredientsText = offData.product.ingredients_text_tr || offData.product.ingredients_text || "";
    if (!ingredientsText) {
      barcodeStatus.classList.add("hidden");
      barcodeError.textContent = "Ürün bulundu ama içindekiler bilgisi yok.";
      barcodeError.classList.remove("hidden");
      return;
    }

    // Bulunan içindekiler metnini analiz için Worker'a gönder
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        mode: "text_analysis",
        ingredients_text: ingredientsText,
        urun_adi: offData.product.product_name || null
      })
    });
    const data = await response.json();
    barcodeStatus.classList.add("hidden");

    if (data.basarili === true) {
      barcodeCard.classList.add("hidden");
      renderResult(data);
    } else {
      barcodeError.textContent = data.kullanici_mesaji || "Analiz yapılamadı.";
      barcodeError.classList.remove("hidden");
    }
  } catch (err) {
    barcodeStatus.classList.add("hidden");
    barcodeError.textContent = "Bağlantı hatası: ürün aranamadı.";
    barcodeError.classList.remove("hidden");
    console.error(err);
  }
}

// ==== Sonuç gösterimi ====
function renderResult(data) {
  const riskClass = data.saglik_riski_skoru >= 66 ? "badge-yuksek"
                   : data.saglik_riski_skoru >= 33 ? "badge-orta"
                   : "badge-dusuk";

  let additivesHtml = "";
  if (Array.isArray(data.katki_maddeleri) && data.katki_maddeleri.length) {
    additivesHtml = data.katki_maddeleri.map(a => `
      <div class="additive-row">
        <span>${escapeHtml(a.isim)}</span>
        <span class="badge badge-${a.risk_seviyesi === 'yüksek' ? 'yuksek' : a.risk_seviyesi === 'orta' ? 'orta' : 'dusuk'}">${escapeHtml(a.risk_seviyesi)}</span>
      </div>
    `).join("");
  }

  resultCard.innerHTML = `
    <h2>${escapeHtml(data.urun_adi || "Ürün")}</h2>
    <div class="risk-score">${data.saglik_riski_skoru}<span style="font-size:16px;color:var(--muted)"> / 100</span></div>
    <span class="badge ${riskClass}">Sağlık Riski</span>
    <p style="color:var(--muted);margin-top:16px;">${escapeHtml(data.genel_yorum || "")}</p>
    <p><strong>Elimine süresi:</strong> ${escapeHtml(data.eliminasyon_suresi || "Bilinmiyor")}</p>
    ${Array.isArray(data.icindekiler) && data.icindekiler.length ? `
      <p><strong>İçindekiler</strong></p>
      <ul class="ingredients">${data.icindekiler.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>
    ` : ""}
    ${additivesHtml ? `<p><strong>Katkı Maddeleri</strong></p>${additivesHtml}` : ""}
    <button class="btn btn-secondary" onclick="location.reload()">Yeni Tarama</button>
  `;
  resultCard.classList.remove("hidden");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}
</script>

</body>
</html>
